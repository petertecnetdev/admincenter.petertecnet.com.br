    <linearGradient id="success" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#57f5d1"/><stop offset="1" stop-color="#50b8ff"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#665cff" stop-opacity=".48"/><stop offset="1" stop-color="#665cff" stop-opacity="0"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="32"/></filter>
  </defs>
