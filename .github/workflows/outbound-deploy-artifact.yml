name: Build Admin Center outbound artifact

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admincenter-outbound-artifact
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate and build production frontend
        env:
          CI: 'true'
        run: |
          npm run lint
          npm run build
          test -s dist/index.html
          printf '%s\n' "$GITHUB_SHA" > dist/release-sha.txt
      - name: Package deployable artifact
        run: tar -C dist -czf admincenter-build.tar.gz .
      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: admincenter-build-${{ github.sha }}
          path: admincenter-build.tar.gz
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
