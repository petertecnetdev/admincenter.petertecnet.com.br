name: Branch cleanup once 2026-10-03

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/branch-cleanup-once-20261003.yml'

permissions:
  contents: write

jobs:
  delete-verified-merged-source:
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged PR #2 source branch
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ref = 'heads/feat/cutinapp-admin-email-composer';
            try {
              await github.rest.git.deleteRef({ owner, repo, ref });
              core.info(`Deleted ${ref}`);
            } catch (error) {
              if (error.status === 404 || error.status === 422) {
                core.info(`${ref} already absent or not deletable; continuing.`);
              } else {
                throw error;
              }
            }
